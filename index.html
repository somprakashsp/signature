<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature Resizer & Cropper — Govt Exam Tool</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: rgba(0,0,0,0.1);
    --border2: rgba(0,0,0,0.2);
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --green: #3B6D11; --green-bg: #EAF3DE;
    --amber: #854F0B; --amber-bg: #FAEEDA;
    --red: #A32D2D; --red-bg: #FCEBEB;
    --radius: 10px;
    --radius-sm: 6px;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .app { width: 100%; max-width: 720px; }
  .app-header { margin-bottom: 1.75rem; }
  .app-header h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .app-header p { font-size: 13px; color: var(--text2); margin-top: 4px; }
  .pill { display: inline-block; background: var(--green-bg); color: var(--green); font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; margin-left: 8px; vertical-align: middle; }

  .drop-zone {
    border: 2px dashed var(--border2);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .drop-zone:hover, .drop-zone.drag { border-color: #3B6D11; background: var(--green-bg); }
  .drop-zone svg { width: 40px; height: 40px; stroke: var(--text3); margin-bottom: 0.75rem; }
  .drop-label { font-size: 15px; font-weight: 500; color: var(--text); }
  .drop-sub { font-size: 12px; color: var(--text3); margin-top: 5px; }
  #fileInput { display: none; }

  .card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem 1.25rem; }
  .section { margin-top: 1.25rem; }
  .sec-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.75rem; }

  .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ctrl-card { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem 0.875rem; }
  .ctrl-card.full { grid-column: 1 / -1; }
  .ctrl-card label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 4px; }
  .ctrl-card .ctrl-title { font-size: 13px; font-weight: 500; color: var(--text); }
  .ctrl-card .ctrl-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }
  .val-badge { float: right; font-size: 12px; font-weight: 600; color: var(--text); }

  /* Input fields for Dimensions */
  .dim-input-group { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
  .dim-input-group input { 
    width: 100%; padding: 6px; border: 1px solid var(--border2); border-radius: 4px; font-size: 13px; outline: none;
  }
  .dim-input-group input:focus { border-color: var(--green); }

  .toggle-row { display: flex; align-items: center; justify-content: space-between; }
  .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .tog-track { position: absolute; inset: 0; background: var(--border2); border-radius: 20px; cursor: pointer; transition: background 0.2s; }
  .toggle input:checked + .tog-track { background: var(--green); }
  .tog-track::before { content: ''; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
  .toggle input:checked + .tog-track::before { transform: translateX(16px); }

  .range-wrap { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .range-wrap input[type=range] { flex: 1; accent-color: var(--green); height: 4px; cursor: pointer; }
  .range-wrap .rng-min, .range-wrap .rng-max { font-size: 11px; color: var(--text3); min-width: 20px; }

  /* Cropper Styling */
  .crop-container { width: 100%; max-height: 350px; background: #000; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 1rem; }
  .crop-container img { display: block; max-width: 100%; }

  .preview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pv-box { background: var(--surface2); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 0.75rem; text-align: center; }
  .pv-box .pv-lbl { font-size: 11px; color: var(--text3); margin-bottom: 8px; font-weight: 500; }
  .pv-box canvas {
    max-width: 100%; height: 90px; object-fit: contain; border-radius: 4px;
    background: repeating-conic-gradient(#ccc 0% 25%, #eee 0% 50%) 0 0/14px 14px;
    display: block; margin: 0 auto;
  }
  .pv-box .pv-meta { font-size: 11px; color: var(--text2); margin-top: 6px; }

  .sz-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .sz-ok { background: var(--green-bg); color: var(--green); }
  .sz-warn { background: var(--amber-bg); color: var(--amber); }
  .sz-err { background: var(--red-bg); color: var(--red); }

  .status { margin-top: 1rem; padding: 0.625rem 0.875rem; border-radius: var(--radius-sm); font-size: 13px; display: none; }
  .status.ok  { background: var(--green-bg); color: var(--green); border: 0.5px solid #C0DD97; }
  .status.warn{ background: var(--amber-bg); color: var(--amber); border: 0.5px solid #FAC775; }
  .status.err { background: var(--red-bg);   color: var(--red);   border: 0.5px solid #F7C1C1; }

  .btn-row { display: flex; gap: 10px; margin-top: 1rem; }
  .btn { padding: 9px 20px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s, background 0.15s; display: flex; align-items: center; gap: 6px; }
  .btn-primary { background: var(--text); color: #fff; }
  .btn-sec { background: transparent; color: var(--text2); border: 0.5px solid var(--border2); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <h1>Signature Resizer <span class="pill">3–30 KB</span></h1>
    <p>Crop, resize dimensions, and remove background for govt exam forms.</p>
  </div>

  <div class="drop-zone" id="dropZone">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 16.004V17a3 3 0 003 3h10a3 3 0 003-3v-1M12 4v12m-4-4l4-4 4 4"/>
    </svg>
    <div class="drop-label">Drop your signature here</div>
    <div class="drop-sub">or click to browse</div>
    <input type="file" id="fileInput" accept="image/*">
  </div>

  <div id="controls" class="hidden">
    <div class="section">
      <div class="sec-label">1. Crop Signature</div>
      <div class="crop-container">
        <img id="cropTarget">
      </div>
    </div>

    <div class="section">
      <div class="sec-label">2. Processing options</div>
      <div class="controls-grid">
        
        <div class="ctrl-card">
          <div class="ctrl-title">Target Dimensions (px)</div>
          <div class="dim-input-group">
            <input type="number" id="targetW" value="256" placeholder="Width">
            <span style="color:var(--text3)">×</span>
            <input type="number" id="targetH" value="128" placeholder="Height">
          </div>
          <div class="ctrl-hint">Common: 200×230 or 140×60</div>
        </div>

        <div class="ctrl-card">
          <div class="toggle-row">
            <div class="ctrl-title">Remove BG</div>
            <label class="toggle"><input type="checkbox" id="removeBg" checked><span class="tog-track"></span></label>
          </div>
          <div class="toggle-row" style="margin-top:8px">
            <div class="ctrl-title">White Fill</div>
            <label class="toggle"><input type="checkbox" id="whiteBg"><span class="tog-track"></span></label>
          </div>
        </div>

        <div class="ctrl-card full">
          <label>Background removal tolerance &nbsp;<span class="val-badge" id="tolVal">40</span></label>
          <div class="range-wrap">
            <span class="rng-min">0</span>
            <input type="range" id="tolerance" min="0" max="120" value="40">
            <span class="rng-max">120</span>
          </div>
        </div>

        <div class="ctrl-card full">
          <label>Target output size &nbsp;<span class="val-badge" id="targetVal">20</span> KB</label>
          <div class="range-wrap">
            <span class="rng-min">3</span>
            <input type="range" id="targetSize" min="3" max="30" value="20">
            <span class="rng-max">30</span>
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="sec-label">3. Preview</div>
      <div class="pv-box">
        <canvas id="procCanvas"></canvas>
        <div class="pv-meta" id="procMeta">—</div>
      </div>
    </div>

    <div id="statusBar" class="status"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="downloadBtn">Process &amp; Download</button>
      <button class="btn btn-sec" id="resetBtn">Reset</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const controls = document.getElementById('controls');
const cropTarget = document.getElementById('cropTarget');
const procCanvas = document.getElementById('procCanvas');
const procMeta = document.getElementById('procMeta');
const statusBar = document.getElementById('statusBar');

// Inputs
const targetW = document.getElementById('targetW');
const targetH = document.getElementById('targetH');
const tolSlider = document.getElementById('tolerance');
const targetSldr = document.getElementById('targetSize');
const removeBgCk = document.getElementById('removeBg');
const whiteBgCk  = document.getElementById('whiteBg');

let cropper = null;

/* ── File Handling ── */
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
dropZone.addEventListener('drop', e => {
  e.preventDefault(); dropZone.classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

function loadFile(f) {
  const reader = new FileReader();
  reader.onload = ev => {
    if(cropper) cropper.destroy();
    cropTarget.src = ev.target.result;
    controls.classList.remove('hidden');
    dropZone.classList.add('hidden');
    
    cropper = new Cropper(cropTarget, {
      viewMode: 1,
      autoCropArea: 0.9,
      ready() { runPreview(); },
      cropend() { runPreview(); },
      zoom() { runPreview(); }
    });
  };
  reader.readAsDataURL(f);
}

/* ── Core Processing Logic ── */
function processImage() {
  if (!cropper) return null;

  // 1. Get Cropped & Resized Canvas
  const width = parseInt(targetW.value) || 200;
  const height = parseInt(targetH.value) || 100;
  
  const oc = cropper.getCroppedCanvas({ width, height });
  const ctx = oc.getContext('2d');
  const tol = parseInt(tolSlider.value);

  // 2. Filter Processing
  const id = ctx.getImageData(0, 0, oc.width, oc.height);
  const px = id.data;

  if (removeBgCk.checked) {
    for (let i = 0; i < px.length; i += 4) {
      const brightness = (px[i] + px[i+1] + px[i+2]) / 3;
      if (brightness > 255 - tol) px[i+3] = 0; // Make transparent
    }
    ctx.putImageData(id, 0, 0);
  }

  // 3. Final background color (must be flat for JPEG)
  const finalCanvas = document.createElement('canvas');
  finalCanvas.width = width; finalCanvas.height = height;
  const fctx = finalCanvas.getContext('2d');
  
  // Always fill white if exporting to JPEG or if user requested whiteBg
  if (whiteBgCk.checked || true) { 
    fctx.fillStyle = '#ffffff';
    fctx.fillRect(0, 0, width, height);
  }
  fctx.drawImage(oc, 0, 0);

  return finalCanvas;
}

function getDataUrl(canvas, targetKB) {
  const targetBytes = targetKB * 1024;
  let lo = 0.05, hi = 1.0, q = 0.8, dataUrl;
  for (let i = 0; i < 10; i++) {
    dataUrl = canvas.toDataURL('image/jpeg', q);
    const sz = atob(dataUrl.split(',')[1]).length;
    if (sz > targetBytes) hi = q; else lo = q;
    q = (lo + hi) / 2;
  }
  return dataUrl;
}

function runPreview() {
  const processed = processImage();
  if (!processed) return;

  // Update Preview Canvas
  const previewCtx = procCanvas.getContext('2d');
  procCanvas.width = processed.width;
  procCanvas.height = processed.height;
  previewCtx.drawImage(processed, 0, 0);

  const targetKB = parseInt(targetSldr.value);
  const dataUrl = getDataUrl(processed, targetKB);
  const bytes = atob(dataUrl.split(',')[1]).length;
  const kb = (bytes / 1024).toFixed(1);

  let statusCls = (bytes >= 3072 && bytes <= 30720) ? 'ok' : 'warn';
  procMeta.innerHTML = `${processed.width}×${processed.height}px · <span class="sz-badge sz-${statusCls}">${kb} KB</span>`;
  showStatus(bytes < 3072 ? 'Too small (under 3KB)' : bytes > 30720 ? 'Too large (over 30KB)' : 'Valid size', statusCls);
}

/* ── UI Helpers ── */
function showStatus(msg, type) {
  statusBar.textContent = msg;
  statusBar.className = 'status ' + type;
  statusBar.style.display = 'block';
}

[targetW, targetH, tolSlider, targetSldr, removeBgCk, whiteBgCk].forEach(el => {
  el.addEventListener('input', () => {
    document.getElementById('tolVal').textContent = tolSlider.value;
    document.getElementById('targetVal').textContent = targetSldr.value;
    runPreview();
  });
});

document.getElementById('downloadBtn').addEventListener('click', () => {
  const canvas = processImage();
  const dataUrl = getDataUrl(canvas, parseInt(targetSldr.value));
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `signature_${targetW.value}x${targetH.value}.jpg`;
  a.click();
});

document.getElementById('resetBtn').addEventListener('click', () => location.reload());
</script>
</body>
</html>
